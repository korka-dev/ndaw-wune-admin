# ==============================================================================
#  NDAW WUNE — Config Nginx pour le Dashboard Admin Next.js
#
#  Sur le VPS Ubuntu :
#    1. Adapter ADMIN_PATH ci-dessous (chemin absolu du dossier admin/)
#    2. Copier dans Nginx :
#         sudo cp nginx-admin.conf /etc/nginx/sites-available/ndawwune-admin
#         sudo ln -sf /etc/nginx/sites-available/ndawwune-admin /etc/nginx/sites-enabled/
#    3. Tester + recharger :
#         sudo nginx -t && sudo systemctl reload nginx
#
#  SSL : si vous n'avez pas encore le certificat Let's Encrypt :
#         sudo apt install certbot python3-certbot-nginx
#         sudo certbot --nginx -d admin.ndawwune.cloud
#  Certbot mettra à jour cette config automatiquement.
# ==============================================================================

# ── Chemin absolu du dossier admin/ sur le VPS ──────────────────────────────
# Chemin supposé : /home/ubuntu/ndawwune/admin  (d'après votre structure de déploiement)
# Si votre dossier est différent, remplacez les deux alias ci-dessous.

# ==============================================================================
#  Bloc 1 — Redirection HTTP → HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name admin.ndawwune.cloud;

    # Certbot peut remplacer ce bloc automatiquement
    return 301 https://$host$request_uri;
}

# ==============================================================================
#  Bloc 2 — Serveur HTTPS principal
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.ndawwune.cloud;

    # ── SSL (Certbot remplit ces lignes automatiquement) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/admin.ndawwune.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.ndawwune.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité de base ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload max (import CSV/XLSX) ─────────────────────────────────────────
    client_max_body_size 50M;

    # =========================================================================
    #  CRITIQUE — Assets statiques Next.js servis DIRECTEMENT par Nginx
    #
    #  C'est la cause du 404 : sans ce bloc, Nginx proxy vers PM2 qui ne
    #  sait pas trouver les chunks. Nginx les sert depuis le disque, zéro
    #  passage par Node.js.
    #
    #  Le chemin alias doit pointer vers :
    #    <admin_path>/.next/standalone/.next/static/
    #  (les fichiers y sont copiés par redeploy_admin.sh à chaque build)
    # =========================================================================
    location /_next/static/ {
        # ↓↓ ADAPTER CE CHEMIN si votre dossier admin est ailleurs ↓↓
        alias /home/ubuntu/ndawwune/admin/.next/standalone/.next/static/;
        # ↑↑ ADAPTER CE CHEMIN ↑↑

        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers publics (favicon, logos, images) ────────────────────────────
    location /public/ {
        # ↓↓ ADAPTER CE CHEMIN si votre dossier admin est ailleurs ↓↓
        alias /home/ubuntu/ndawwune/admin/.next/standalone/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Tout le reste → PM2 / Next.js (port 3000) ───────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_cache_bypass  $http_upgrade;
    }
}
