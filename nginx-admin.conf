# ==============================================================================
#  NDAW WUNE — Config Nginx pour le Dashboard Admin (version Docker)
#
#  Le conteneur Docker sert le Next.js standalone sur 127.0.0.1:3000.
#  Nginx fait le SSL et le reverse proxy — c'est tout.
#  Aucun chemin filesystem à configurer : Docker gère les fichiers statiques.
#
#  Sur le VPS Ubuntu :
#    sudo cp nginx-admin.conf /etc/nginx/sites-available/ndawwune-admin
#    sudo ln -sf /etc/nginx/sites-available/ndawwune-admin \
#                /etc/nginx/sites-enabled/ndawwune-admin
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL (si pas encore fait) :
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d admin.ndawwune.cloud
# ==============================================================================

# ── Redirection HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.ndawwune.cloud;

    return 301 https://$host$request_uri;
}

# ── Serveur HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.ndawwune.cloud;

    # Certificat Let's Encrypt (Certbot remplit automatiquement ces lignes)
    ssl_certificate     /etc/letsencrypt/live/admin.ndawwune.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.ndawwune.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Sécurité
    add_header X-Frame-Options   "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy   "strict-origin-when-cross-origin" always;

    # Taille max pour les imports (CSV, XLSX)
    client_max_body_size 50M;

    # ── Assets statiques Next.js ─────────────────────────────────────────────
    # Le conteneur les sert directement.
    # Nginx ajoute seulement les bons en-têtes de cache (immutable = 1 an).
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        # Cache navigateur long (les noms de fichiers contiennent un hash unique)
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Tout le reste → conteneur Docker (Next.js port 3000) ─────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
